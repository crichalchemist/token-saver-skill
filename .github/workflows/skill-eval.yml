name: skill-eval
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: [SKILL.md, "references/**", "tests/**", .github/workflows/skill-eval.yml]
  pull_request:
    paths: [SKILL.md, "references/**"]
jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [D1-zod-schema, D2-fixtures-volume, D3-jsdoc, K1-jwt-deadline, K2-billing-batch, V1-defective-delegate, V2-delegate-timeout, V3-false-success, F1-no-mcp, C1-config-guard]
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g @anthropic-ai/claude-code opencode-ai
      - id: eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TOKEN_SAVER_RUNS: ${{ runner.temp }}/runs
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          bash tests/run-local.sh ci ${{ matrix.scenario }} 1
      - if: always()
        run: |
          mkdir -p verdicts/${{ matrix.scenario }}-${{ matrix.rep }} && cp tests/results/ci/${{ matrix.scenario }}/1/verdict.json verdicts/${{ matrix.scenario }}-${{ matrix.rep }}/ && cat verdicts/${{ matrix.scenario }}-${{ matrix.rep }}/verdict.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdict-${{ matrix.scenario }}-${{ matrix.rep }}
          path: verdicts/
  aggregate:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: all, pattern: "verdict-*", merge-multiple: true }
      - run: node tests/score.js --aggregate all --min 2 --expect 10
